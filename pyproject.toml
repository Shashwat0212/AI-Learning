[project]
name = "askmydocs"
version = "0.1.0"
description = "Stage-level SLA measurement and tracing system"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["askmydocs/tests"]
asyncio_mode = "auto"